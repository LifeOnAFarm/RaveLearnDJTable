name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng libportaudio2 ffmpeg
      - run: python -m pip install 'numpy>=1.24,<3' 'sounddevice>=0.5,<0.6'
      - run: cp config.example.json config.json
      - run: python tools/bootstrap_assets.py
      - run: python -m djtable --check-assets
      - run: python tools/check_media.py
      - run: python -m unittest discover -s tests -v
      - name: Shell scripts parse and use LF line endings
        run: |
          for script in deploy/*.sh; do sh -n "$script"; done
          ! grep -l $'\r' deploy/*.sh deploy/*.py deploy/*.service deploy/*.socket
